version: 2
updates:
  - package-ecosystem: npm
    directory: /Ekasi pay
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      frontend-dev-tooling:
        patterns:
          - '@babel/*'
          - '@vitejs/*'
          - vite
          - vitest
          - eslint*
          - '@typescript-eslint/*'

  - package-ecosystem: npm
    directory: /Ekasi pay/backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend

  - package-ecosystem: npm
    directory: /Ekasi pay/ops-dashboard
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ops-dashboard

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
