name: Dependency hotfix

on:
  push:
    paths:
      - '.github/workflows/dependency-hotfix.yml'

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Repair customer app production dependencies
        working-directory: Ekasi pay
        run: |
          npm ci
          npm audit fix --package-lock-only
          npm audit --omit=dev --audit-level=high

      - name: Repair ops production dependencies
        working-directory: Ekasi pay/ops-dashboard
        run: |
          npm ci
          npm audit fix --package-lock-only
          npm audit --omit=dev --audit-level=high

      - name: Commit refreshed lockfiles directly to main
        run: |
          if git diff --quiet -- "Ekasi pay/package-lock.json" "Ekasi pay/ops-dashboard/package-lock.json"; then
            echo "Lockfiles already clean."
            exit 0
          fi
          git config user.name "KasiPay CI"
          git config user.email "actions@users.noreply.github.com"
          git add "Ekasi pay/package-lock.json" "Ekasi pay/ops-dashboard/package-lock.json"
          git commit -m "Fix audited production dependencies"
          git push origin HEAD:main
