# Ekasi Pay — Render Blueprint
# Repo layout: app code lives under "Ekasi pay/" (note the space).
# After first sync, set in the Render dashboard (never commit these):
#   ekasi-pay-api AND ekasi-pay-reconcile-worker DATABASE_URL = same Neon KasiPay URL
#   Optional: DATA_ENCRYPTION_KEY + PII_HASH_PEPPER copied from the env that wrote
#   existing Neon ciphertexts. Do not invent a new key. Non-funds boot derives
#   them from JWT_SECRET when unset.
# Money-movement flags stay false until production-readiness evidence is approved.
# FRONTEND_ORIGINS on ekasi-pay-api must include both web and ops origins
# (comma-separated), e.g. https://ekasi-pay-web.onrender.com,https://ekasi-ops-dashboard.onrender.com
# After blueprint sync, confirm ekasi-pay-redis exists and API RATE_LIMIT_REDIS_URL
# is the Key Value connection string (not a dashboard paste).

services:
  - type: keyvalue
    name: ekasi-pay-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: ekasi-pay-api
    runtime: node
    rootDir: Ekasi pay/backend
    buildCommand: npm ci && npm run migrate:validate && npm run build
    preDeployCommand: npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: NON_FUNDS_PRODUCTION
        value: "true"
      - key: FINANCIAL_POSTING_ENABLED
        value: "false"
      - key: LEDGER_DRIFT_KILL_SWITCH
        value: "1"
      - key: CASH_SEND_ENABLED
        value: "false"
      - key: LENDING_ENABLED
        value: "false"
      - key: LENDING_DISBURSEMENT_ENABLED
        value: "false"
      - key: INSURANCE_ENABLED
        value: "false"
      - key: STOKVEL_MONEY_MOVEMENT_ENABLED
        value: "false"
      - key: LIVE_UTILITIES_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SMS_PROVIDER
        value: "disabled"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: CLICKATELL_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        fromService:
          name: ekasi-pay-web
          type: web
          property: host
      - key: OPS_DASHBOARD_ORIGIN
        fromService:
          name: ekasi-ops-dashboard
          type: web
          property: host
      - key: FRONTEND_ORIGINS
        value: "https://ekasi-pay-web.onrender.com,https://ekasi-ops-dashboard.onrender.com"
      - key: OPS_JWT_SECRET
        generateValue: true
      - key: OPS_REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: PIN_RESET_PEPPER
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: DATA_ENCRYPTION_KEY_VERSION
        value: "1"
      - key: PII_HASH_PEPPER
        sync: false
      - key: PII_HASH_PEPPER_VERSION
        value: "1"
      - key: PRIVATE_STORAGE_PROVIDER
        sync: false
      - key: PRIVATE_STORAGE_SIGNING_ENDPOINT
        sync: false
      - key: PRIVATE_STORAGE_SIGNING_SECRET
        sync: false
      - key: PRIVATE_STORAGE_ENCRYPTION_KEY_REF
        sync: false
      - key: MALWARE_SCANNER_PROVIDER
        sync: false
      - key: MALWARE_SCANNER_CALLBACK_SECRET
        sync: false
      - key: REFRESH_COOKIE_ENABLED
        value: "true"
      - key: BEARER_REFRESH_COMPATIBILITY
        value: "false"
      - key: MONITORING_PROVIDER
        sync: false
      - key: MONITORING_DSN
        sync: false
      - key: ALERT_ROUTING_MARKER
        sync: false
      - key: RATE_LIMIT_REDIS_URL
        fromService:
          name: ekasi-pay-redis
          type: keyvalue
          property: connectionString
      - key: AUDIT_SINK_PROVIDER
        sync: false
      - key: AUDIT_SINK_ENDPOINT
        sync: false
      - key: AUDIT_SINK_API_KEY
        sync: false
      - key: SANCTIONS_PEP_PROVIDER
        sync: false
      - key: SANCTIONS_PEP_ENDPOINT
        sync: false
      - key: SANCTIONS_PEP_API_KEY
        sync: false
      - key: BACKUP_PROVIDER
        sync: false
      - key: BACKUP_ENCRYPTION_MARKER
        sync: false
      - key: BACKUP_PITR_MARKER
        sync: false
      - key: BACKUP_VERIFICATION_MARKER
        sync: false
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      # Flip only after production-readiness evidence is approved for that product.

  - type: worker
    name: ekasi-pay-reconcile-worker
    runtime: node
    rootDir: Ekasi pay/backend
    buildCommand: npm ci && npm run build
    startCommand: npm run reconcile:worker
    autoDeployTrigger: checksPass
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: NON_FUNDS_PRODUCTION
        value: "true"
      - key: RECONCILIATION_INTERVAL_MINUTES
        value: "15"
      # Same Neon connection as ekasi-pay-api (set in dashboard; blueprint cannot copy secrets).
      - key: DATABASE_URL
        sync: false
      - key: SMS_PROVIDER
        value: "disabled"
      - key: FINANCIAL_POSTING_ENABLED
        value: "false"
      - key: LEDGER_DRIFT_KILL_SWITCH
        value: "1"
      - key: CASH_SEND_ENABLED
        value: "false"
      - key: LENDING_ENABLED
        value: "false"
      - key: LENDING_DISBURSEMENT_ENABLED
        value: "false"
      - key: INSURANCE_ENABLED
        value: "false"
      - key: STOKVEL_MONEY_MOVEMENT_ENABLED
        value: "false"
      - key: LIVE_UTILITIES_ENABLED
        value: "false"
      - key: PII_HASH_PEPPER
        sync: false
      - key: PII_HASH_PEPPER_VERSION
        value: "1"
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: DATA_ENCRYPTION_KEY_VERSION
        value: "1"
      # Same monitoring path as API so fail-closed reconcile can page on-call.
      - key: MONITORING_PROVIDER
        sync: false
      - key: MONITORING_DSN
        sync: false
      - key: ALERT_ROUTING_MARKER
        sync: false

  - type: web
    name: ekasi-pay-web
    runtime: static
    rootDir: Ekasi pay
    buildCommand: npm ci && node scripts/write-runtime-config.mjs && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://ekasi-pay-api.onrender.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: VITE_REFRESH_COOKIE
        value: "true"
      - key: VITE_SUPPORT_WHATSAPP
        sync: false
      - key: VITE_SUPPORT_PHONE
        sync: false
      - key: VITE_SUPPORT_PHONE_DISPLAY
        sync: false
      - key: VITE_SUPPORT_EMAIL
        value: "ivanjohnsonijj@gmail.com"
      - key: API_HOST
        fromService:
          name: ekasi-pay-api
          type: web
          property: host

  - type: web
    name: ekasi-ops-dashboard
    runtime: node
    rootDir: Ekasi pay/ops-dashboard
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        fromService:
          name: ekasi-pay-api
          type: web
          property: host
      - key: VITE_API_URL
        fromService:
          name: ekasi-pay-api
          type: web
          property: host
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
